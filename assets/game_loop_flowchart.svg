<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
    <clipPath id="clip-b1"><rect x="180" y="34" width="280" height="56" rx="12"/></clipPath>
    <clipPath id="clip-b2"><rect x="180" y="130" width="280" height="56" rx="12"/></clipPath>
    <clipPath id="clip-b3"><rect x="180" y="226" width="280" height="56" rx="12"/></clipPath>
    <clipPath id="clip-b4"><rect x="180" y="332" width="280" height="56" rx="12"/></clipPath>
    <clipPath id="clip-b5"><rect x="180" y="428" width="280" height="56" rx="12"/></clipPath>
    <clipPath id="clip-exit"><rect x="560" y="226" width="290" height="56" rx="12"/></clipPath>
  </defs>

  <!-- 1. 배경 사각형 (1) -->
  <rect x="0" y="0" width="900" height="540" fill="#f6f8fc"/>

  <!-- 2. B1 (2) -->
  <g clip-path="url(#clip-b1)">
    <rect x="180" y="34" width="280" height="56" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="180" y="34" width="4" height="56" fill="#f59e0b"/>
  </g>
  <rect x="180" y="34" width="280" height="56" rx="12" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="200" y="67" font-family="sans-serif" font-size="16" font-weight="700" fill="#1e293b">while (running) 검사</text>

  <!-- 3. B2 (3) -->
  <g clip-path="url(#clip-b2)">
    <rect x="180" y="130" width="280" height="56" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="180" y="130" width="4" height="56" fill="#3b82f6"/>
  </g>
  <rect x="180" y="130" width="280" height="56" rx="12" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="200" y="163" font-family="sans-serif" font-size="16" font-weight="700" fill="#1e293b">① Render — 화면 출력</text>

  <!-- 4. B3 (4) -->
  <g clip-path="url(#clip-b3)">
    <rect x="180" y="226" width="280" height="56" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="180" y="226" width="4" height="56" fill="#ef4444"/>
  </g>
  <rect x="180" y="226" width="280" height="56" rx="12" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="200" y="259" font-family="sans-serif" font-size="16" font-weight="700" fill="#1e293b">② 종료 조건 검사</text>

  <!-- 5. B4 (5) -->
  <g clip-path="url(#clip-b4)">
    <rect x="180" y="332" width="280" height="56" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="180" y="332" width="4" height="56" fill="#8b5cf6"/>
  </g>
  <rect x="180" y="332" width="280" height="56" rx="12" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="200" y="365" font-family="sans-serif" font-size="16" font-weight="700" fill="#1e293b">③ Input — 메뉴 입력</text>

  <!-- 6. B5 (6) -->
  <g clip-path="url(#clip-b5)">
    <rect x="180" y="428" width="280" height="56" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="180" y="428" width="4" height="56" fill="#10b981"/>
  </g>
  <rect x="180" y="428" width="280" height="56" rx="12" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="200" y="461" font-family="sans-serif" font-size="16" font-weight="700" fill="#1e293b">④ Update — 조건문 분기</text>

  <!-- 7. Exit (7) -->
  <g clip-path="url(#clip-exit)">
    <rect x="560" y="226" width="290" height="56" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="560" y="226" width="4" height="56" fill="#ef4444"/>
  </g>
  <rect x="560" y="226" width="290" height="56" rx="12" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="580" y="259" font-family="sans-serif" font-size="16" font-weight="700" fill="#1e293b">승리/파산 메시지 출력 후 break</text>

  <!-- 화살표 1: B1 -> B2 -->
  <path d="M 320 90 L 320 128" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 화살표 2: B2 -> B3 -->
  <path d="M 320 186 L 320 224" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 화살표 3: B3 -> B4 (계속) -->
  <path d="M 320 282 L 320 330" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="330" y="311" font-family="sans-serif" font-size="13" font-weight="600" fill="#475569">계속</text>

  <!-- 화살표 4: B3 -> Exit (승리/파산) -->
  <path d="M 460 254 L 558 254" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="510" y="245" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#dc2626">승리/파산</text>

  <!-- 화살표 5: B4 -> B5 -->
  <path d="M 320 388 L 320 426" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 화살표 6: B5 -> B1 (다음 반복) -->
  <path d="M 180 456 L 96 456 L 96 62 L 178 62" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <text x="86" y="259" text-anchor="end" font-family="sans-serif" font-size="13" font-weight="600" fill="#475569">다음 반복</text>
</svg>
